name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSIONS: 18,20,22

jobs:
  # Detect whether source-relevant files changed so PRs that only touch docs
  # can skip the heavier test/build jobs while still running lint.
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run-tests:
              - 'src/**'
              - 'lib/**'
              - 'app/**'
              - '*.{js,ts,mjs,cjs,json}'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vitest.config.*'
              - 'jest.config.*'

  lint:
    needs: changed-files
    if: >
      always() &&
      (needs.changed-files.outputs.run-tests == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Run lint
        run: npm run lint --if-present || echo "No lint script configured; skipping"

  typecheck:
    needs: changed-files
    if: >
      always() &&
      (needs.changed-files.outputs.run-tests == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Run typecheck
        run: npx tsc --noEmit --if-present || echo "No TypeScript project configured; skipping"

  test:
    needs: changed-files
    if: >
      always() &&
      (needs.changed-files.outputs.run-tests == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Run tests with coverage
        run: npm test --if-present -- --coverage --ci || echo "No test script configured; skipping"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  build:
    needs: [lint, typecheck, test]
    if: >
      always() &&
      (needs.changed-files.outputs.run-tests == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Run build
        run: npm run build --if-present || echo "No build script configured; skipping"
      - name: Turbo cache (monorepo)
        if: exists('turbo.json') || exists('package.json')
        uses: actions/cache/restore@v4
        with:
          path: |
            .turbo
            node_modules/.cache
          key: turbo-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml', 'yarn.lock') }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.node-version }}
          path: |
            dist/
            build/
            .next/
            out/
          retention-days: 30

  security:
    needs: changed-files
    if: >
      always() &&
      (needs.changed-files.outputs.run-tests == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit (moderate+)
        run: npm audit --audit-level=moderate || true
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v5
        with:
          config: >-
            p/owasp-top-ten
            p/secrets
          publish: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  deploy:
    needs: [build, security]
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run build for deploy
        run: npm run build --if-present || echo "No build script configured; skipping"
      - name: Deploy to production
        run: echo "Deploying ${{ github.repository }} to production (placeholder)"
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
