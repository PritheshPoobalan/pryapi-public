name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository files
        run: |
          test -f README.md || echo "WARNING: README.md not found"
          test -f LICENSE || echo "WARNING: LICENSE not found"
          test -f SECURITY.md || echo "WARNING: SECURITY.md not found"